d');if(prev)prev.classList.remove('selected');line.classList.add('selected');if(n.children.length&&e.detail===2){if(expanded.has(n.id))expanded.delete(n.id);else expanded.add(n.id);drawIps()}});rowById.set(n.id,line);frag.appendChild(line);if(expanded.has(n.id)||filtered)visitChildren(n.children,depth+1,'n'+n.id)}roots.forEach(function(n){visit(n,0)});host.appendChild(frag);if(count>=renderLimit)host.appendChild(el('div','ix-empty','Показаны первые '+renderLimit+' строк. Сверните ветки или уточните поиск.'))}
